<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="mPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="mGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Solid Edge-to-Edge Background for Maskable Icon Safe Zone -->
  <rect width="512" height="512" fill="url(#mBgGrad)"/>

  <!-- Centered Safe-Zone Graphic (scaled to 75% inside 512x512) -->
  <g transform="translate(64, 60) scale(0.75)">
    <!-- Box Base -->
    <path d="M120 220 L256 150 L392 220 L392 360 L256 430 L120 360 Z" fill="#0f172a" stroke="url(#mPrimaryGrad)" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Top Isometric Lid -->
    <path d="M120 220 L256 150 L392 220 L256 290 Z" fill="url(#mAccentGrad)" opacity="0.9"/>
    
    <!-- Left Flap / Shade -->
    <path d="M120 220 L256 290 L256 430 L120 360 Z" fill="#1e3a8a" opacity="0.6"/>
    
    <!-- Right Flap / Highlight -->
    <path d="M256 290 L392 220 L392 360 L256 430 Z" fill="#1d4ed8" opacity="0.8"/>
    
    <!-- Front Divider Seam -->
    <line x1="256" y1="290" x2="256" y2="430" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>

    <!-- Central Emblem -->
    <g transform="translate(256, 335)">
      <circle cx="0" cy="0" r="46" fill="#020617" stroke="#38bdf8" stroke-width="7"/>
      <path d="M -9 -24 H 9 V -9 H 24 V 9 H 9 V 24 H -9 V 9 H -24 V -9 H -9 Z" fill="url(#mGoldGrad)"/>
    </g>

    <text x="256" y="474" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#94a3b8" letter-spacing="4">CRISTOLÂNDIA</text>
  </g>
</svg>
