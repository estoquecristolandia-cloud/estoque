<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="240" r="140" fill="#2563eb" opacity="0.15" filter="url(#glow)"/>

  <!-- Stylized Supply Box / Almoxarifado Icon -->
  <g transform="translate(0, -10)">
    <!-- Box Base -->
    <path d="M120 220 L256 150 L392 220 L392 360 L256 430 L120 360 Z" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Top Isometric Lid -->
    <path d="M120 220 L256 150 L392 220 L256 290 Z" fill="url(#accentGrad)" opacity="0.9"/>
    
    <!-- Left Flap / Shade -->
    <path d="M120 220 L256 290 L256 430 L120 360 Z" fill="#1e3a8a" opacity="0.6"/>
    
    <!-- Right Flap / Highlight -->
    <path d="M256 290 L392 220 L392 360 L256 430 Z" fill="#1d4ed8" opacity="0.8"/>
    
    <!-- Front Divider Seam -->
    <line x1="256" y1="290" x2="256" y2="430" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>

    <!-- Central Emblem: Bread/Cross/Heart of Cristolândia -->
    <g transform="translate(256, 335) scale(0.95)">
      <!-- Shield circle -->
      <circle cx="0" cy="0" r="42" fill="#020617" stroke="#38bdf8" stroke-width="6"/>
      <!-- Humanitarian Cross -->
      <path d="M -8 -22 H 8 V -8 H 22 V 8 H 8 V 22 H -8 V 8 H -22 V -8 H -8 Z" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- Title Monogram / Label Detail -->
  <text x="256" y="474" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#94a3b8" letter-spacing="4">CRISTOLÂNDIA</text>
</svg>
